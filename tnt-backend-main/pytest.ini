[pytest]
# ── Cache ──────────────────────────────────────────────────────────────────
# Explicit writable cache dir (avoids PermissionError on read-only overlays).
cache_dir = .pytest_cache

# ── Warning filters ────────────────────────────────────────────────────────
# Format: action:message_regex:category_class
filterwarnings =
    # Keep: genuine resource leaks must be caught.
    error::ResourceWarning
    # Standard suppression.
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # ── ML / sklearn / XGBoost safe suppressions ──────────────────────────
    # sklearn: emitted when param_grid has fewer combos than n_iter; harmless.
    ignore:The total space of parameters.*is smaller than n_iter:UserWarning
    # sklearn: non-finite CV scores from fold errors; fixed by CPU device patch.
    ignore:One or more of the test scores are non-finite:UserWarning
    # sklearn: FitFailedWarning — wrap around per-fold errors (fixed by CPU patch).
    ignore::sklearn.exceptions.FitFailedWarning
    # XGBoost/CUDA warnings on CPU-only or Windows sandbox machines.
    ignore:.*cuda.*:UserWarning
    # LightGBM verbosity.
    ignore:.*LightGBM.*:UserWarning

# ── Default addopts (full test-suite) ─────────────────────────────────────
addopts = --cov=app --cov-report=term-missing --cov-fail-under=80 --import-mode=importlib
